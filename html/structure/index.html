        <script>
            function addTwoNumber() {
                let first = prompt("Enter the first integer");
                let second = prompt("Enter the second integer");
                first = parseInt(first)
                second = parseInt(second)
    
                if(isNaN(first) || isNaN(second)) {
                   return alert("Please enter valid integers"); 
                }

                let sum = first + second;

                alert("The sum is " + sum);

            }

           // addTwoNumber()

           /**
            * Calculates the area of a circle
            * @param {number} The radius of the circle
            * @returns {number} The area of the circle
            * */
           function areaOfACircle(radius) {
                // A = pi * r ** 2

                let area = 3.14 * Math.pow(radius, 2)

                console.log(area)

                return area
           }

           areaOfACircle(3)
           areaOfACircle(6)
           areaOfACircle(9)
           areaOfACircle(12)
           areaOfACircle(75)
           areaOfACircle(65)
        </script>
